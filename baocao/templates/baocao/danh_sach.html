<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sổ ra/vào</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; color: #111; background: #fff; }
    section { border: 1px solid #bbb; padding: 12px 16px; margin-bottom: 16px; max-width: 900px; }
    h2 { margin-top: 0; font-size: 1.1rem; }
    form p { margin: 6px 0; }
    label { display: inline-block; min-width: 180px; }
    .chu-thich { color: #555; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Sổ ra/vào</h1>
  {% for so in cac_so %}
    <section>
      <h2>{{ so.dinh_nghia.ma }} — {{ so.dinh_nghia.ten }}</h2>
      {% if so.duoc_xuat %}
        <form method="get" action="{% url 'baocao:xuat_excel' so.dinh_nghia.duong_dan %}">
          {{ so.form.as_p }}
          <button type="submit">Xuất Excel</button>
          <button type="submit" formaction="{% url 'baocao:xuat_word' so.dinh_nghia.duong_dan %}">Xuất Word</button>
          <button type="submit" formaction="{% url 'baocao:xuat_pdf' so.dinh_nghia.duong_dan %}">Xuất PDF</button>
        </form>
      {% else %}
        <p class="chu-thich">Bạn không có quyền xuất sổ này.</p>
      {% endif %}
    </section>
  {% empty %}
    <p>Bạn không có quyền xem sổ nào.</p>
  {% endfor %}
</body>
</html>
